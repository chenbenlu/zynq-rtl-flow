name: build-image

# Publish the simulation toolchain image to GHCR. Decoupled from the per-PR
# regression so the slow Verilator-from-source build only runs when the
# toolchain definition actually changes.
on:
  push:
    branches: [main, master]
    paths:
      - "docker/**"
      - "pyproject.toml"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase repository path.
      - id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/zynq_cnn-dev:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/zynq_cnn-dev:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
